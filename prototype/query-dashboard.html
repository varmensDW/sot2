  <script>
    (()=>{
      const root=document.getElementById('query-concept');
      const screen=root.querySelector('#q-screen');
      const icon=(name)=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
      const esc=(value)=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const art=(type)=>`<span class="q-art ${type}" role="img" aria-label="Illustrative product thumbnail"><i class="wire"></i><i class="cap"></i><i class="shade"></i><i class="glow"></i></span>`;
      const issues=[
        {id:'Q-1042',date:'06 Nov',time:'09:42',sku:'DEMO-PND-AMB',name:'Amber pendant shade',art:'pendant',account:'LEDsone UK',platform:'Amazon',market:'UK',stage:'Post-sale',topic:'Material',summary:'Listed as glass. Customer reports an acrylic shade.',photos:2,action:'Update SOT',kind:'update',next:'Correct shade material',quote:'The description says this is glass, but the shade I received feels like plastic. Can you confirm what it is made from?',sot:'Glass',listed:'Glass',proposed:'Acrylic',field:'Shade material',location:'Product specifications → Materials → Shade material',evidence:'Demo supplier specification identifies this exact variant as acrylic. Staff verification is shown as complete in this sample.',instruction:'Change Shade material from Glass to Acrylic for this variant, then check the saved SOT value before sending the correction to the listing tool.',verified:true,listing:'Amber dome pendant shade — glass finish',photoCaption:'Customer attachment · material detail'},
        {id:'Q-1041',date:'06 Nov',time:'09:18',sku:'DEMO-FLX-BLK',name:'Black fabric flex',art:'cable',account:'LEDsone UK',platform:'eBay',market:'UK',stage:'Pre-sale',topic:'Dimensions',summary:'How much cable is supplied with this kit?',photos:0,action:'Add to SOT',kind:'add',next:'Verify supplied cable length',quote:'Before I order, can you tell me how long the cable is? I cannot find it on the page.',sot:'Blank',listed:'Not stated',proposed:null,field:'Supplied cable length',location:'Product specifications → Dimensions → Supplied cable length',evidence:'The existing SOT field is blank. No verified measurement is available in this sample.',instruction:'Measure or obtain documentation for the cable supplied with this SKU. Add the verified length and its unit to the existing field. Do not infer it from the photograph.',verified:false,listing:'Black braided fabric cable kit'},
        {id:'Q-1040',date:'05 Nov',time:'16:35',sku:'DEMO-E27-WW',name:'E27 filament bulb',art:'bulb',account:'LEDsone DE',platform:'Amazon',market:'DE',stage:'Pre-sale',topic:'Dimmability',summary:'Customer asks whether this bulb is dimmable.',photos:0,action:'Have SOT',kind:'have',next:'Clarify the listing',quote:'Ist diese Glühbirne dimmbar?',translation:'Is this bulb dimmable?',sot:'Non-dimmable',listed:'Not stated',proposed:'Non-dimmable',field:'Dimmable',location:'Product specifications → Electrical → Dimmable',evidence:'The demo SOT record and manufacturer sheet agree: this exact variant is non-dimmable.',instruction:'SOT already answers the question. Add “Non-dimmable” to the listing specification and relevant description. No SOT change is needed.',verified:true,listing:'E27 warm white filament bulb'},
        {id:'Q-1039',date:'05 Nov',time:'14:06',sku:'DEMO-SHD-BLK',name:'Black dome shade',art:'black',account:'LEDsone UK',platform:'eBay',market:'UK',stage:'Post-sale',topic:'Dimensions',summary:'Listing says 30 cm; customer measures 20 cm.',photos:1,action:'Verify detail',kind:'waiting',next:'Check variant and measurement',quote:'The listing says 30cm, but this shade is only 20cm across. I have attached a photo with the ruler.',sot:'30 cm',listed:'30 cm',proposed:null,field:'Shade diameter',location:'Product specifications → Dimensions → Shade diameter',evidence:'The customer reports 20 cm. Variant identity and the measurement basis still need confirmation; the claim alone does not establish the correct value.',instruction:'Confirm the sold variant and measure the shade diameter. Decide whether SOT, the listing, or fulfilment needs correction once evidence is available.',verified:false,listing:'Black industrial shade — 30 cm',photoCaption:'Customer attachment · measurement'},
        {id:'Q-1038',date:'05 Nov',time:'11:50',sku:'Variant unresolved',name:'Pendant shade variants',art:'pendant',account:'LEDsone UK',platform:'Amazon',market:'UK',stage:'Pre-sale',topic:'Compatibility',summary:'Will this shade fit an E27 holder with a 40 mm ring?',photos:0,action:'Identify variant',kind:'waiting',next:'Two candidate SKUs',quote:'Will this shade fit my E27 holder? The retaining ring is 40mm. I am looking at the two types on your listing.',sot:'Depends on variant',listed:'Two variants',proposed:null,field:'Shade opening diameter',location:'Resolve the variant before selecting a SOT record',evidence:'This demo listing maps to two variants with different opening diameters. No chosen variant is available.',instruction:'Confirm Type A or Type B. Keep this clear compatibility question in Customer Queries while the SKU is unresolved.',verified:false,candidates:true,listing:'Pendant shade — choose Type A or Type B'},
        {id:'Q-1037',date:'04 Nov',time:'15:22',sku:'DEMO-DRV-24',name:'24V LED driver',art:'driver',account:'LEDsone UK',platform:'Shopify',market:'UK',stage:'Pre-sale',topic:'Electrical',summary:'Title says 12V, specification says 24V. Which is correct?',photos:0,action:'Have SOT',kind:'have',next:'2 of 3 listings published',quote:'Your title says 12V but the specification says 24V. Which output voltage is correct for this model?',sot:'24 V DC',listed:'12 V in title',proposed:'24 V DC',field:'Output voltage',location:'Product specifications → Electrical → Output voltage',evidence:'Demo SOT and product documentation confirm 24 V DC for this exact SKU. The listing title is incorrect.',instruction:'Keep SOT unchanged. Correct the output-voltage claim in affected listing titles. This sample correction has two published listings and one failed target.',verified:true,listing:'LED driver — 12V / 24V specification',job:true},
        {id:'Q-1036',date:'04 Nov',time:'10:15',sku:'DEMO-WALL-BLK',name:'Black wall light',art:'black',account:'LEDsone FR',platform:'Amazon',market:'FR',stage:'Pre-sale',topic:'Suitability',summary:'What IP rating is specified for this wall light?',photos:0,action:'Waiting for source',kind:'waiting',next:'Retry SOT connection',quote:'Quel est l’indice de protection IP de cette applique ?',translation:'What is the IP rating of this wall light?',sot:'Source unavailable',listed:'Not stated',proposed:null,field:'IP rating',location:'SOT record could not be retrieved',evidence:'The SOT source is unavailable in this demo scenario. This does not establish that the IP rating is missing.',instruction:'Retrieve the SOT record and product-specific documentation before recommending an action. Do not infer IP rating or suitability from appearance.',verified:false,listing:'Black industrial wall light',unavailable:true},
        {id:'Q-1035',date:'04 Nov',time:'09:08',sku:'Not yet identified',name:'Product not identified',art:'pendant',account:'LEDsone UK',platform:'eBay',market:'UK',stage:'Unknown',topic:'Unclear',summary:'“It does not fit” — product detail needs clarification.',photos:0,action:'Needs review',kind:'review',next:'Which parts do not fit?',quote:'It does not fit. Can you help?',sot:'SKU unresolved',listed:'No listing identified',proposed:null,field:'Not established',location:'Product identity and query meaning unresolved',evidence:'No earlier message, order reference, or attachment resolves which parts the customer means.',instruction:'Clarification needed: Which two parts are you trying to fit together, and what are their model numbers or measurements?',verified:false,listing:'No listing identified',review:true}
      ];
      const defaults={view:'queries',selected:null,filter:'all',search:'',platform:'all',stage:'all',scenario:'original',queued:[],completed:[],driverPublished:false,notice:''};
      let state={...defaults};
      const design={layout:'Table',density:'Comfortable'};
      const readSaved=saved=>{const s=saved?.privateContent;if(s&&['queries','review','updates','insights'].includes(s.view)){state={...defaults,...s,selected:issues.some(x=>x.id===s.selected)?s.selected:null,queued:Array.isArray(s.queued)?s.queued.filter(id=>issues.some(x=>x.id===id)):[],completed:Array.isArray(s.completed)?s.completed.filter(id=>issues.some(x=>x.id===id)):[],notice:''};}};
      readSaved(window.openai?.widgetState);
      const ownSnapshots=[];
      const persist=()=>{if(window.openai?.setWidgetState){const saved={...state,notice:''};ownSnapshots.push(JSON.stringify(saved));if(ownSnapshots.length>20)ownSnapshots.shift();window.openai.setWidgetState({modelContent:{sampleDesign:'QUERY dashboard concept',view:state.view,selectedIssue:state.selected,layout:design.layout},privateContent:saved}).catch(()=>{});}};
      const fmtBadge=(q)=>`<span class="q-badge ${q.kind}">${esc(q.action)}</span>`;
      function iconRefresh(){if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:15,height:15}});}
      function notice(text){state.notice=text;renderNotice();}
      function renderNotice(){root.querySelector('#q-notice').innerHTML=state.notice?`<div class="q-notice"><span>${esc(state.notice)}</span><button type="button" data-action="dismiss" aria-label="Dismiss message">${icon('x')}</button></div>`:'';iconRefresh();}
      function head(title,sub,eyebrow='PRODUCT KNOWLEDGE'){return `<div class="q-page-head"><div><span class="q-eyebrow">${eyebrow}</span><h1>${title}</h1><p>${sub}</p></div><span class="q-small" style="padding-top:6px">04–06 Nov 2026</span></div>`;}
      function rows(){const filtered=issues.filter(q=>(state.view==='review'?q.review:!q.review)&&(state.filter==='all'||q.kind===state.filter)&&(state.platform==='all'||q.platform===state.platform)&&(state.stage==='all'||q.stage===state.stage)&&`${q.sku} ${q.name} ${q.summary} ${q.account} ${q.market} ${q.topic}`.toLowerCase().includes(state.search.toLowerCase()));
        const holder=screen.querySelector('.q-rows');if(!holder)return;
        holder.innerHTML=filtered.length?filtered.map(q=>`<article class="q-row" aria-label="${esc(q.id+' '+q.summary)}"><div class="q-date">${q.date}<small>${q.time}</small></div><div class="q-product-cell">${art(q.art)}<div><div class="q-sku">${esc(q.sku)}</div><div class="q-product-name">${q.name}</div><div class="q-channel"><b>${q.platform}</b> · ${q.market}<span>${q.account}</span></div></div></div><div class="q-query-cell"><button type="button" class="q-summary-button" data-issue="${q.id}">${q.summary}</button><div class="q-row-meta"><span>${q.stage}</span><span>·</span><span>${q.topic}</span>${q.photos?`<button class="q-photo-link" type="button" data-issue="${q.id}">${icon('image')} ${q.photos} photo${q.photos>1?'s':''}</button>`:''}</div></div><div class="q-status-cell">${fmtBadge(q)}<span class="q-next">${state.completed.includes(q.id)?'All listings published':state.queued.includes(q.id)?'Queued for listing tool':q.job&&state.driverPublished?'3 of 3 listings published':q.next}</span></div><button type="button" class="q-open" data-issue="${q.id}" aria-label="Open ${q.id}">${icon('chevron-right')}</button></article>`).join(''):`<div class="q-empty">No matching product queries.<br><button type="button" class="q-btn text" data-action="clear-filters">Clear filters</button></div>`;
        screen.querySelector('.q-result-count').textContent=`${filtered.length} issue${filtered.length===1?'':'s'}`;screen.querySelector('.q-filter-count').textContent=`Showing ${filtered.length} of ${state.view==='review'?1:7} demo issues`;iconRefresh();}
      function renderList(){const review=state.view==='review';screen.innerHTML=head(review?'A little context needed.':'Every question, a clearer product.',review?'Only questions whose meaning is still unclear after checking the conversation.':'Turn customer product questions into precise SOT and listing improvements.')+(!review?`<div class="q-stats"><div class="q-stat"><strong>7</strong><div><span>Product queries</span><small>Distinct customer issues</small></div></div><div class="q-stat"><strong>2</strong><div><span>SOT actions</span><small>1 update · 1 addition</small></div></div><div class="q-stat"><strong>${state.queued.length+1}</strong><div><span>Listing corrections</span><small>${state.driverPublished?'Driver correction published':'1 publication needs attention'}</small></div></div></div>`:'')+`<section class="q-list-panel"><div class="q-tabs" aria-label="SOT action filters">${(review?[['all','Needs review']]:[['all','All queries'],['update','Update SOT'],['add','Add to SOT'],['have','Have SOT'],['waiting','To verify']]).map(([value,label])=>`<button type="button" data-filter="${value}" aria-pressed="${state.filter===value}">${label}</button>`).join('')}<span class="q-result-count"></span></div><div class="q-toolbar"><label class="q-search">${icon('search')}<input id="q-search-input" type="search" placeholder="Search SKU, topic, account…" aria-label="Search customer queries" value="${esc(state.search)}"></label><select id="q-platform" aria-label="Filter by platform"><option value="all">All platforms</option>${['Amazon','eBay','Shopify'].map(p=>`<option ${state.platform===p?'selected':''}>${p}</option>`).join('')}</select><select id="q-stage" aria-label="Filter by sale stage"><option value="all">Pre & post sale</option>${['Pre-sale','Post-sale','Unknown'].map(s=>`<option ${state.stage===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="q-grid-head"><span>Received</span><span>Product / channel</span><span>Customer need</span><span>SOT / next action</span><span></span></div><div class="q-rows"></div><div class="q-list-foot"><span class="q-filter-count"></span><span>Relevant customer messages only</span></div></section><div class="q-bottom-note">${icon('shield-check')} Staff replies and operational messages stay out of this list.</div>`;rows();}
      function renderDetail(){const q=issues.find(x=>x.id===state.selected);if(!q){state.selected=null;render();return;}const queued=state.queued.includes(q.id),done=state.completed.includes(q.id);const actionLabel=q.job?'View listing progress':queued||done?'View listing progress':q.kind==='have'?'Confirm listing correction':q.verified?'Check SOT update':q.unavailable?'Preview source retry':q.review?'Save clarification for review':q.candidates?'Review variant candidates':'Mark verification requested';
        screen.innerHTML=`<button type="button" class="q-btn text q-back" data-action="back">${icon('arrow-left')} Back to ${q.review?'needs review':'customer queries'}</button><div class="q-detail-title">${art(q.art)}<div><span class="q-eyebrow">${q.id} · ${q.stage}</span><h1>${q.name}</h1><div class="q-detail-sub"><span>${esc(q.sku)}</span><span>${q.account} · ${q.platform} · ${q.market}</span></div></div></div><div class="q-detail-layout"><div><section class="q-block"><div class="q-block-heading"><h3>The customer’s question</h3><span class="q-small">${q.date} · ${q.time}</span></div><p style="font-size:13px;font-weight:550">${q.summary}</p><blockquote class="q-quote">“${q.quote}”</blockquote>${q.translation?`<p class="q-small">Translation: ${q.translation}</p>`:''}${q.photos?`<div class="q-attachment">${Array.from({length:q.photos},(_,i)=>`<button type="button" class="q-photo" data-photo="${i+1}" aria-label="Open illustrative customer attachment ${i+1}"><div class="q-photo-scene">${art(q.art)}</div><span>Demo photo ${i+1} ${icon('expand')}</span></button>`).join('')}</div>`:''}<details><summary>Conversation context</summary><p>Customer text is the issue source. Relevant staff answers and follow-up evidence appear here without creating extra customer queries.</p><p class="q-small">Synthetic conversation for design review.</p></details></section><section class="q-block" id="q-listing-evidence"><div class="q-block-heading"><h3>Compare the evidence</h3>${icon('columns-2')}</div><div class="q-compare"><div class="q-fact"><label>Listing says</label><strong>${q.listed}</strong><small>Current demo snapshot · 06 Nov</small></div><div class="q-fact"><label>SOT says</label><strong>${queued&&q.kind==='update'?q.proposed:q.sot}</strong><small>${q.unavailable?'Source retrieval failed':'Demo record · 06 Nov 2026'}</small></div></div><p class="q-evidence">${q.evidence}</p>${q.review?'':`<a href="#q-listing-evidence" class="q-btn text" data-action="listing">${icon('external-link')} View listing snapshot</a>`}${q.candidates?`<div class="q-candidates"><div class="q-candidate"><strong>DEMO-SHD-A</strong>Type A · 28 mm opening</div><div class="q-candidate"><strong>DEMO-SHD-B</strong>Type B · 40 mm opening</div></div>`:''}<div id="q-listing-snapshot" hidden class="q-location"><strong>${q.listing}</strong>Listing link would open the actual marketplace listing in the working system. This prototype contains a local sample snapshot only.<br>Historical listing at purchase: unavailable.</div></section></div><div><section class="q-block"><div class="q-block-heading"><h3>Recommended action</h3>${fmtBadge(q)}</div><p class="q-action-copy">${q.instruction}</p><div class="q-location"><strong>${q.field}</strong>${q.location}<br><span class="q-small">${esc(q.sku)} · example field path</span></div>${q.proposed?`<div class="q-change"><span class="old">${q.kind==='have'?q.listed:q.sot}</span>${icon('arrow-right')}<span class="new">${q.proposed}</span></div>`:`<p class="q-small" style="margin:12px 0">Proposed value: <strong>awaiting evidence</strong></p>`}${q.verified?`<p class="q-small" style="margin-bottom:13px">${icon('badge-check')} Product evidence verified in this demo</p>`:''}<button type="button" class="q-btn primary q-full" data-action="primary">${icon(q.job||queued||done?'arrow-up-right':q.kind==='have'?'send':'scan-line')}${actionLabel}</button><p class="q-note">${q.kind==='update'?'Staff edit SOT in the existing system. This check verifies the saved value.':q.kind==='have'?'Only the listing needs correction. Preserve the SOT value.':'Missing or uncertain information stays visible until verified.'}</p>${q.verified&&q.kind==='update'&&!queued?`<div class="q-demo-controls"><label for="q-scenario">Prototype controls · simulated SOT source</label><select id="q-scenario"><option value="original" ${state.scenario==='original'?'selected':''}>Before staff edit · Glass</option><option value="corrected" ${state.scenario==='corrected'?'selected':''}>After staff edit · Acrylic</option><option value="delayed" ${state.scenario==='delayed'?'selected':''}>Source sync delayed</option></select></div>`:''}<div id="q-action-result" role="status" aria-live="polite"></div></section><section class="q-block"><h3>Correction progress</h3><ol class="q-timeline"><li><span class="q-step-dot done">✓</span><div>Product question identified<small>Customer evidence retained</small></div></li><li><span class="q-step-dot ${q.verified?'done':''}">${q.verified?'✓':'2'}</span><div>${q.kind==='have'?'SOT already correct':'Verify product and SOT'}<small>${q.verified?'Product evidence available':'Check the specific missing evidence'}</small></div></li><li><span class="q-step-dot ${queued||q.job?'done':''}">${queued||q.job?'✓':'3'}</span><div>Listing correction queued<small>${queued||q.job?'Verified correction handed off':'Requires confirmed value and identity'}</small></div></li><li><span class="q-step-dot ${done||q.job&&state.driverPublished?'done':''}">${done||q.job&&state.driverPublished?'✓':'4'}</span><div>Publication confirmed<small>${done?'All demo targets published':q.job?(state.driverPublished?'3 of 3 listings published':'2 of 3 listings published'):'Waiting for listing-tool result'}</small></div></li></ol></section></div><div id="q-lightbox" hidden class="q-lightbox" role="dialog" aria-modal="false" aria-label="Illustrative customer attachment"></div></div>`;
      }
      function targetRow(platform,market,status){return `<div class="q-publish-row">${icon('store')}<span><strong>${platform}</strong><span class="q-small"> · ${market} · LEDsone ${market}</span></span><span class="q-badge ${status==='Published'?'published':status==='Failed'?'failed':'waiting'}">${status}</span></div>`;}
      function renderUpdates(){screen.innerHTML=head('Close the loop.','Track each verified correction through to marketplace publication.','SOT → LISTING TOOL')+`<section class="q-job"><div class="q-job-head"><div><h3>Correct output voltage in listing titles</h3><div class="q-small">DEMO-DRV-24 · Output voltage · 12 V → 24 V DC</div></div><span class="q-badge ${state.driverPublished?'published':'failed'}">${state.driverPublished?'Published':'1 listing needs attention'}</span></div><div class="q-progress" role="progressbar" aria-label="Driver listing publication" aria-valuemin="0" aria-valuemax="3" aria-valuenow="${state.driverPublished?3:2}"><span style="width:${state.driverPublished?100:66.67}%"></span></div><p class="q-small">${state.driverPublished?3:2} of 3 affected listings published</p>${targetRow('Amazon','UK','Published')}${targetRow('Shopify','UK','Published')}${targetRow('eBay','UK',state.driverPublished?'Published':'Failed')}<div class="q-job-actions">${!state.driverPublished?'<button type="button" class="q-btn" data-action="retry-driver">Simulate retry & confirmation</button>':''}<button type="button" class="q-btn text" data-issue="Q-1037">View customer issue ${icon('arrow-up-right')}</button></div>${!state.driverPublished?'<p class="q-note">Demo error: marketplace request timed out. Completed targets do not need republishing.</p>':'<p class="q-note">Demo listing-tool confirmation received for all three targets.</p>'}</section>${state.queued.map(id=>{const q=issues.find(q=>q.id===id),done=state.completed.includes(id);return `<section class="q-job"><div class="q-job-head"><div><h3>${q.kind==='have'?'Clarify '+q.field:'Update '+q.field.toLowerCase()}</h3><div class="q-small">${q.sku} · ${q.kind==='have'?q.listed:q.sot} → ${q.proposed}</div></div><span class="q-badge ${done?'published':'waiting'}">${done?'Published':'Queued'}</span></div><div class="q-progress" role="progressbar" aria-label="${esc(q.sku)} publication" aria-valuemin="0" aria-valuemax="2" aria-valuenow="${done?2:0}"><span style="width:${done?100:0}%"></span></div><p class="q-small">${done?2:0} of 2 affected listings published</p>${targetRow('Amazon',q.market,done?'Published':'Queued')}${targetRow('eBay',q.market,done?'Published':'Queued')}<div class="q-job-actions">${!done?`<button type="button" class="q-btn primary" data-publish="${id}">Simulate publish confirmation</button>`:''}<button type="button" class="q-btn text" data-issue="${id}">View customer issue ${icon('arrow-up-right')}</button></div><p class="q-note">Demo only · No correction was sent to another system.</p></section>`;}).join('')}<div class="q-bottom-note">${icon('badge-check')} Published means the listing tool confirmed the specific correction for that listing.</div>`;}
      function renderInsights(){const topicCounts=Object.entries(issues.filter(q=>!q.review).reduce((a,q)=>(a[q.topic]=(a[q.topic]||0)+1,a),{})).sort((a,b)=>b[1]-a[1]);screen.innerHTML=head('What customers need to know.','Find repeated information gaps and prioritize the next product improvement.','CUSTOMER INSIGHTS')+`<div class="q-insights"><section class="q-block"><div class="q-block-heading"><h3>Questions by product topic</h3><span class="q-small">7 distinct issues</span></div>${topicCounts.map(([topic,count])=>`<div class="q-bar-row"><div class="q-bar-label"><span>${topic}</span><strong>${count}</strong></div><div class="q-bar" role="img" aria-label="${topic}: ${count} issues"><span style="width:${count/2*100}%"></span></div></div>`).join('')}<p class="q-note" style="margin-top:20px">Counts use the sample issue set. Follow-ups are not counted as new customer issues.</p></section><section class="q-block"><h3>Prepared next actions</h3>${['Q-1042','Q-1041','Q-1040'].map(id=>{const q=issues.find(q=>q.id===id);return `<div class="q-insight-row"><div>${fmtBadge(q)}<p style="margin-top:7px">${q.next}</p><span class="q-small">${q.sku}</span></div><button type="button" class="q-btn text" data-issue="${id}" aria-label="Open ${id}">${icon('arrow-up-right')}</button></div>`;}).join('')}</section></div><section class="q-block"><h3>Are corrections reducing repeat questions?</h3><p class="q-evidence">Compare distinct customer cases for the same SKU and attribute before and after confirmed publication.</p><p class="q-small" style="margin-top:12px">No outcome trend is shown: this prototype has no live post-publication history.</p></section>`;}
      function render(){root.classList.toggle('q-cards',design.layout==='Cards');root.style.setProperty('--q-row-pad',design.density==='Compact'?'11px':'17px');root.querySelectorAll('[data-view]').forEach(b=>{if(b.dataset.view===state.view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});root.querySelector('#q-crumb').textContent={queries:'Customer queries',review:'Needs review',updates:'Listing updates',insights:'Insights'}[state.view];if(state.selected)renderDetail();else if(state.view==='updates')renderUpdates();else if(state.view==='insights')renderInsights();else renderList();renderNotice();iconRefresh();}
      root.addEventListener('input',e=>{if(e.target.id==='q-search-input'){state.search=e.target.value;rows();persist();}});
      root.addEventListener('change',e=>{if(e.target.id==='q-platform'){state.platform=e.target.value;rows();}else if(e.target.id==='q-stage'){state.stage=e.target.value;rows();}else if(e.target.id==='q-scenario'){state.scenario=e.target.value;const r=root.querySelector('#q-action-result');if(r)r.innerHTML='';}persist();});
      root.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b||!root.contains(b))return;
        if(b.dataset.view){state.view=b.dataset.view;state.selected=null;state.filter='all';state.search='';state.platform='all';state.stage='all';state.notice='';render();}
        else if(b.dataset.issue){state.selected=b.dataset.issue;state.notice='';render();}
        else if(b.dataset.filter){state.filter=b.dataset.filter;render();}
        else if(b.dataset.photo){const q=issues.find(q=>q.id===state.selected);const box=root.querySelector('#q-lightbox');box.hidden=false;box.innerHTML=`<div class="q-block-heading"><h2>Customer image preview</h2><button type="button" class="q-btn" data-action="close-photo">Close ${icon('x')}</button></div><div class="q-photo-scene">${art(q.art)}</div><p class="q-small" style="margin-top:15px">Illustrative attachment ${b.dataset.photo} · No real customer image is used in this prototype.</p>`;iconRefresh();box.querySelector('button').focus();}
        else if(b.dataset.publish){if(!state.completed.includes(b.dataset.publish))state.completed.push(b.dataset.publish);state.notice='Demo confirmation received. Both affected listings now show Published.';render();}
        else if(b.dataset.action){const action=b.dataset.action;
          if(action==='reset'){state={...defaults,queued:[],completed:[]};render();}
          if(action==='dismiss'){state.notice='';renderNotice();}
          if(action==='back'){const q=issues.find(q=>q.id===state.selected);state.view=q?.review?'review':'queries';state.selected=null;state.notice='';render();}
          if(action==='clear-filters'){state.filter='all';state.search='';state.platform='all';state.stage='all';render();}
          if(action==='close-photo'){root.querySelector('#q-lightbox').hidden=true;root.querySelector('[data-photo]')?.focus();}
          if(action==='listing'){e.preventDefault();const panel=root.querySelector('#q-listing-snapshot');panel.hidden=!panel.hidden;}
          if(action==='retry-driver'){state.driverPublished=true;state.notice='Demo retry succeeded. Listing-tool confirmation: 3 of 3 listings published.';render();}
          if(action==='primary'){const q=issues.find(q=>q.id===state.selected);const result=root.querySelector('#q-action-result');
            if(q.job||state.queued.includes(q.id)){state.selected=null;state.view='updates';render();}
            else if(q.verified&&(q.kind==='have'||state.scenario==='corrected')){if(!state.queued.includes(q.id))state.queued.push(q.id);state.notice=q.kind==='have'?'Demo listing-only correction queued. SOT stays unchanged.':'Demo SOT value verified as Acrylic. One correction queued for the listing tool.';render();}
            else if(q.verified){result.innerHTML=`<div class="q-alert">${state.scenario==='delayed'?'Waiting for SOT sync. The updated source has not arrived. No correction queued.':'SOT still says Glass. Save the verified Acrylic value in SOT, then check again.'}</div>`;}
            else if(q.unavailable){result.innerHTML='<div class="q-alert">Demo source remains unavailable. Retry is pending; no missing-data action has been inferred.</div>';}
            else if(q.candidates){result.innerHTML='<div class="q-alert">Type A and Type B have different opening diameters. Confirm the intended variant before preparing a correction.</div>';}
            else if(q.review){result.innerHTML='<div class="q-alert success">Clarification saved in this demo. No customer message has been sent.</div>';}
            else{result.innerHTML='<div class="q-alert success">Verification requested in this demo. A correction value remains unset until evidence is available.</div>';}
          }
        }persist();
      });
      root.addEventListener('keydown',e=>{if(e.key==='Escape'){const box=root.querySelector('#q-lightbox');if(box&&!box.hidden){box.hidden=true;root.querySelector('[data-photo]')?.focus();}}});
      window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState;if(saved&&!ownSnapshots.includes(JSON.stringify(saved.privateContent))){readSaved(saved);render();}});
      render();
      if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();persist();}});tweak.addSelect(design,'layout',{label:'Query layout',options:['Table','Cards']});tweak.addSelect(design,'density',{label:'Row spacing',options:['Comfortable','Compact']});}
    })();
  </script>
</div>
